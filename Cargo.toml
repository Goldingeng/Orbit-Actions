[package]
name = "orbit-actions"
version = "0.1.1"
edition = "2021"
description = "Fast radial menu for Windows, a Rust fork of Kando"
license = "MIT"
repository = "https://github.com/Goldingeng/Orbit-Actions"
build = "build.rs"

[[bin]]
name = "orbit-actions"
path = "src/main.rs"

[[bin]]
name = "orbit-actions-settings"
path = "src/editor/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
serde_json = "1"
tiny-skia = "0.11"
ab_glyph = "0.2"
resvg = { version = "0.45", default-features = false }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.15"
raw-window-handle = "0.6"
image-webp = "0.2"
base64 = "0.22"
tungstenite = { version = "0.24", features = ["native-tls"] }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
]

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Globalization",
    "Win32_Media_Audio",
    "Win32_Networking_WinInet",
    "Win32_System_Registry",
    "Win32_UI_Input_XboxController",
]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
